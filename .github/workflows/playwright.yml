name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start local Supabase
        run: supabase start

      - name: Create E2E environment files
        run: |
          cat > backend/.env.e2e <<'EOF'
          NODE_ENV=development
          E2E=true
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PORT=4000
          JWT_SECRET=e2e-only-secret
          EOF

          cat > frontend/.env.e2e <<'EOF'
          NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
          PLAYWRIGHT_TEST_EMAIL=e2e-login@moriahproject.org
          PLAYWRIGHT_TEST_EMAIL_PASSWORD=Password123!
          EOF

      - name: Reset and seed E2E database
        run: npm run e2e:db:reset

      - name: Verify seeded E2E login
        shell: bash
        run: |
          cd backend

          setsid npm run dev:e2e > /tmp/moriah-e2e-backend.log 2>&1 &
          BACKEND_PID=$!

          trap 'kill -- -"$BACKEND_PID" 2>/dev/null || true' EXIT

          READY=false

          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            cat /tmp/moriah-e2e-backend.log
            exit 1
          fi

          if ! curl --fail-with-body -sS \
            -o /tmp/moriah-login-response.json \
            -w 'Login HTTP status: %{http_code}\n' \
            -X POST http://localhost:4000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-login@moriahproject.org","password":"Password123!"}'; then
            cat /tmp/moriah-login-response.json
            cat /tmp/moriah-e2e-backend.log
            exit 1
          fi

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30