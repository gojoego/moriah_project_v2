name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Backend dependencies (needed if building/testing backend locally)
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Build backend so dist/server.js exists
      - name: Build backend
        working-directory: backend
        run: npm run build

      # Start backend locally
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run start > backend.log 2>&1 &
      - name: Wait for backend
        run: npx wait-on http://localhost:4000/health --timeout 60000
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build

      # Install browsers
      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # Run E2E tests
      - name: Run Playwright tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_EMAIL_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_EMAIL_PASSWORD }}
        run: npx playwright test
      - name: Show backend logs
        if: failure()
        run: cat backend/backend.log
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30