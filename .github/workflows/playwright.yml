name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # NEW: install Supabase CLI
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      # NEW: start disposable local Supabase
      - name: Start local Supabase
        run: supabase start

      # NEW: rebuild schema and insert E2E-only test user
      - name: Reset and seed E2E database
        run: npm run e2e:db:reset

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # CHANGED: Playwright config now starts backend + frontend
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30